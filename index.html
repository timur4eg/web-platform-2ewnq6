<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Chat Bot</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="header-info">
                    <h1>Google Assistant</h1>
                    <p class="status">Онлайн</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="action-btn" id="clearChat" title="Очистить чат">
                    <i class="fas fa-trash"></i>
                </button>
                <button class="action-btn" id="settings" title="Настройки">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="message-text">
                        Привет! Я Google Assistant. Чем могу помочь вам сегодня?
                    </div>
                    <div class="message-time">Сейчас</div>
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." maxlength="500">
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
                <button class="voice-btn" id="voiceBtn" title="Голосовой ввод">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>
            <div class="quick-actions">
                <button class="quick-action" data-action="weather">🌤️ Погода</button>
                <button class="quick-action" data-action="time">🕐 Время</button>
                <button class="quick-action" data-action="joke">😄 Шутка</button>
                <button class="quick-action" data-action="help">❓ Помощь</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Настройки</h2>
                <button class="close-btn" id="closeSettings">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="botName">Имя бота:</label>
                    <input type="text" id="botName" value="Google Assistant">
                </div>
                <div class="setting-group">
                    <label for="theme">Тема:</label>
                    <select id="theme">
                        <option value="light">Светлая</option>
                        <option value="dark">Темная</option>
                        <option value="auto">Авто</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="soundEnabled" checked>
                        Звуковые уведомления
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
